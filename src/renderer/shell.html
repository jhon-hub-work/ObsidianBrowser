<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data: https:;" />
  <title>Obsidian</title>
  <link rel="icon" href="../../assets/favicon.svg" />
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div id="app">

    <!-- ============ sidebar (full height) ============ -->
    <nav id="sidebar">
      <div class="brand">
        <img src="../../assets/icon.svg" alt="" />
        <span>Obsidian</span>
      </div>

      <div class="side-scroll">
        <span class="label">Pinned</span>
        <div id="pinned"></div>
        <span class="label">Workspaces</span>
        <div id="workspaces"></div>
      </div>

      <div class="profile">
        <div class="pfp"></div>
        <div class="who">
          <b>Jhon</b>
          <!-- Local-first means saying so here. There is no account and no sync;
               a "Pro / synced" badge would be advertising neither. -->
          <small>Local profile</small>
        </div>
        <button class="icon-btn" id="settings" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.5.6.86 1.12.91H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
        </button>
      </div>
    </nav>

    <!-- ============ topbar ============ -->
    <header id="topbar">
      <div class="omnibox">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#74747c" stroke-width="2">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <input id="omnibox" placeholder="Search or Ask AI..." spellcheck="false" autocomplete="off" />
        <span class="kbd">Ctrl K</span>
      </div>

      <span class="private-pill">Private</span>

      <div class="topbar-actions">
        <button class="icon-btn" id="nav-back" title="Back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <button class="icon-btn" id="nav-forward" title="Forward">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18l6-6-6-6" />
          </svg>
        </button>
        <button class="icon-btn" id="nav-reload" title="Reload">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 1 1-3-6.7L21 8" /><path d="M21 3v5h-5" />
          </svg>
        </button>
        <button class="icon-btn" id="downloads" title="Downloads">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="M12 4v12" /><path d="m7 12 5 5 5-5" /><path d="M5 20h14" />
          </svg>
        </button>
        <button class="icon-btn" id="shield" title="Trackers blocked">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="M12 3l7 3v6c0 4.4-3 8-7 9-4-1-7-4.6-7-9V6z" />
            <path d="M12 9v5" /><path d="M9.5 11.5h5" />
          </svg>
          <span class="badge" id="shield-badge" hidden></span>
        </button>
        <button class="icon-btn" id="private" title="New private tab (Ctrl+Shift+N)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 12h18" /><path d="M6 12l1.5-4.5A2 2 0 0 1 9.4 6h5.2a2 2 0 0 1 1.9 1.5L18 12" />
            <circle cx="7" cy="15.5" r="2.5" /><circle cx="17" cy="15.5" r="2.5" />
          </svg>
        </button>
        <button class="icon-btn" id="open-settings" title="Settings (Ctrl+,)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="5" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="12" cy="19" r="1.6" />
          </svg>
        </button>
        <div class="avatar"></div>
      </div>
    </header>

    <!-- ============ tab strip ============ -->
    <div id="tabbar">
      <div id="tabs"></div>
      <button id="new-tab" title="New tab (Ctrl T)">+</button>
    </div>

    <!-- ============ native view hole ============ -->
    <main id="content"></main>

    <!-- ============ right rail (full height) ============ -->
    <aside id="aside">
      <!-- Windows caption buttons own the top-right corner of the window -->
      <div class="caption">
        <button id="w-min" title="Minimize" aria-label="Minimize">
          <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button id="w-max" title="Maximize" aria-label="Maximize">
          <svg id="max-icon" width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="0.5" y="0.5" width="9" height="9" />
          </svg>
        </button>
        <button id="w-close" class="danger" title="Close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1">
            <path d="M0 0l10 10M10 0L0 10" />
          </svg>
        </button>
      </div>

      <span class="label rail-label">AI Assistant</span>

      <button class="model-chip">
        <span class="dot"></span>
        <span>Claude Opus 4.8</span>
        <span class="caret">&#9660;</span>
      </button>

      <div id="aside-nav"></div>

      <div class="today">
        <div class="today-head">
          <span class="label">Today</span>
          <button id="today-close" title="Hide">&times;</button>
        </div>
        <div class="stat"><span>Tabs opened</span><b id="stat-tabs">0</b></div>
        <div class="stat"><span>Trackers blocked</span><b id="stat-blocked">0</b></div>
        <div class="stat"><span>Time focused</span><b class="accent" id="stat-time">0m</b></div>
      </div>
    </aside>

  </div>

  <div class="toast" id="toast"></div>

  <!-- ============ command palette (Ctrl+K) ============ -->
  <div id="palette" class="palette" hidden>
    <div class="palette-box" role="dialog" aria-label="Command palette">
      <div class="palette-input-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2">
          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
        </svg>
        <input id="palette-input" placeholder="Search or Ask AI…  —  type a command" spellcheck="false" autocomplete="off" />
        <span class="palette-hint">esc</span>
      </div>
      <div id="palette-list" class="palette-list"></div>
    </div>
  </div>

  <!-- boot splash: icon lands center, slides left, wordmark reveals -->
  <div id="splash" aria-hidden="true">
    <div class="splash-lockup">
      <img class="splash-icon" src="../../assets/icon.svg" alt="" />
      <div class="splash-word-clip"><span class="splash-word">OBSIDIAN</span></div>
    </div>
    <div class="splash-tag">Everything disappears until you need it.</div>
  </div>

  <script src="shell.js"></script>
</body>
</html>
